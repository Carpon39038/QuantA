name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  harness:
    name: Harness gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python - <<'PY'
          import subprocess
          import sys
          import tomllib

          with open("pyproject.toml", "rb") as handle:
              dependencies = tomllib.load(handle)["project"].get("dependencies", [])

          if dependencies:
              subprocess.check_call([sys.executable, "-m", "pip", "install", *dependencies])
          PY

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Repo harness docs
        run: python3 scripts/check_harness_docs.py

      - name: Execution harness acceptance
        run: python3 scripts/check_execution_harness.py --require-all-passing

      - name: Smoke
        run: scripts/smoke.sh

      - name: Lint changed TypeScript files
        shell: bash
        run: |
          set -euo pipefail

          base_sha="${{ github.event.pull_request.base.sha || github.event.before }}"
          head_sha="${{ github.event.pull_request.head.sha || github.sha }}"
          zero_sha="0000000000000000000000000000000000000000"

          if [[ -z "$base_sha" || "$base_sha" == "$zero_sha" ]]; then
            base_sha="$(git rev-list --max-parents=0 "$head_sha")"
          fi

          mapfile -t changed_files < <(
            git diff --name-only --diff-filter=ACMR "$base_sha" "$head_sha" -- "*.ts" "*.tsx"
          )

          if (( ${#changed_files[@]} == 0 )); then
            echo "No changed TypeScript files to lint."
            exit 0
          fi

          pnpm exec eslint "${changed_files[@]}" --cache --ext .ts,.tsx
